<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body{
        height: 100vh;
        width: 100vw;
    }
    .container{
        height: 100%;
        width: 100%;
        background-color:rgb(255, 174, 144);
        display: grid;
        padding: 4rem;/*root element ka liye 10 */
        row-gap: 1rem;
        /* column-gap: 1rem; */
        grid-template-rows:1fr 1fr 1fr;
        grid-template-columns: 1fr 1fr 1fr;
        column-gap: 1rem;

    }
    .items{
        background-color:rgb(255, 187, 221);
        border: 5px solid white;
        color: white;
        display: flex;
        gap: 1rem;
        justify-content: center;
        align-items: center;
        font-size: 2rem;
    }
    .header{
        grid-column-start:1 ;
        grid-column-end:4 ;
    }
    .footer{
        grid-column-start:1 ;
        grid-column-end:4 ;
        
        min-height: 5rem;
    }
    .sidebar{
        grid-row-start:2 ;
        grid-row-end:4 ;
    }
    .content1{
        grid-column-start:2 ;
        grid-column-end:4 ;
    }
</style>
<body>  
    <div class="container">
        <div class="items header">Header</div>
        <div class="items sidebar">Sidebar</div>
        <div class="items content1">content1</div>
        <div class="items content2">content2</div>
        <div class="items content3">content3</div>
        <div class="items footer">footer</div>    
</body>
</html>
